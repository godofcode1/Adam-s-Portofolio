<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">CLOSE ✕</button>
  <div class="lightbox-inner">
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-info">
      <div class="li-head">
        <span class="li-num" id="lightboxNum"></span>
        <span class="li-title" id="lightboxTitle"></span>
      </div>
      <div class="li-tags">
        <span id="lightboxType"></span>
      </div>
      <p class="li-blurb" id="lightboxBlurb"></p>
    </div>
  </div>
</div>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightboxImg');
const lbNum = document.getElementById('lightboxNum');
const lbTitle = document.getElementById('lightboxTitle');
const lbType = document.getElementById('lightboxType');
const lbBlurb = document.getElementById('lightboxBlurb');

const numberPalette = ['var(--magenta)','var(--cyan)','var(--yellow)','var(--red)','var(--blue)','var(--green)'];
const allCards = Array.from(document.querySelectorAll('.work-card'));

allCards.forEach((card, index) => {
  card.addEventListener('click', () => {
    lbImg.src = card.dataset.img;
    lbImg.alt = card.querySelector('img').alt;
    lbNum.textContent = card.querySelector('.wnum').textContent;
    lbNum.style.color = numberPalette[index % numberPalette.length];
    lbTitle.textContent = card.dataset.title + ' — ' + card.dataset.subject;
    lbType.textContent = card.dataset.type;
    lbBlurb.textContent = card.dataset.blurb;
    lightbox.classList.add('open');
    lightbox.scrollTop = 0;
    lockScroll();
    lightboxCloseBtn.focus();
  });
});

const lightboxCloseBtn = document.getElementById('lightboxClose');

function lockScroll(){
  const y = window.scrollY;
  document.body.dataset.scrollY = y;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${y}px`;
  document.body.style.left = '0';
  document.body.style.right = '0';
}
function unlockScroll(){
  const y = parseInt(document.body.dataset.scrollY || '0', 10);
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  window.scrollTo(0, y);
}

function closeLightbox(){
  lightbox.classList.remove('open');
  lbImg.src = '';
  unlockScroll();
}
lightboxCloseBtn.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });
</script>
